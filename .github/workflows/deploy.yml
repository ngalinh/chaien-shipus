name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: BASSO server chỉ chạy backend/frontend, KHÔNG
            # chạy local-runner (Playwright/Chrome sống trên máy riêng) — bỏ qua tải Chromium.
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --omit=dev || echo "npm install skipped (node_modules exists)"
            npm --prefix client install || echo "client install skipped"
            npm --prefix client run build
            cp client/dist/index.html index.html
            sudo cp client/dist/assets/*.js assets/ 2>/dev/null || true
            sudo cp client/dist/assets/*.css assets/ 2>/dev/null || true
            sudo cp client/dist/assets/*.png assets/ 2>/dev/null || true
            pm2 restart chaien-shipus --update-env || pm2 start server.js --name chaien-shipus --env production
            pm2 save
